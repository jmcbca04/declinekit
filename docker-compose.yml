# DeclineKit, self-hosted: the app, Postgres, and a scheduler for the email jobs.
#   cp .env.example .env   # fill it in
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: declinekit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: declinekit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U declinekit"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://declinekit:${POSTGRES_PASSWORD}@db:5432/declinekit
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Runs the recovery-email sequence hourly and the card-expiry check daily (14:00 UTC).
  scheduler:
    image: alpine:3
    restart: unless-stopped
    env_file: .env
    depends_on: [app]
    command: >
      sh -c 'apk add --no-cache curl >/dev/null &&
             echo "0 * * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/dunning" > /etc/crontabs/root &&
             echo "0 14 * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/expiring" >> /etc/crontabs/root &&
             crond -f -l 8'

volumes:
  pgdata:
